name: Publish satellite frames
run-name: Satellite publication (${{ inputs.trigger_source || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Caller of the publication job
        type: choice
        options: [manual, supabase_cron]
        default: manual

# One publisher owns latest.json and cleanup. Never cancel a publication mid-upload.
concurrency:
  group: satellite-publication
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SATELLITE_SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SATELLITE_SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Publish completed scans and expire old images
        run: node scripts/publish-satellite.cjs
